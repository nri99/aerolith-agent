[package]
name = "aerolith-agent"
version = "0.2.0"
edition = "2024"
description = "Ultra-lightweight Rust browser engineered for AI agents: native MCP server, semantic DOM snapshotting, Set-Of-Marks visual grounding, and REST/CLI agent control"
authors = ["nri2 <113144550+nri2@users.noreply.github.com>"]
repository = "https://github.com/nri99/aerolith-agent"
license = "MIT OR Apache-2.0"

[dependencies]
redb = "4.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.34"
wry = "0.57"
