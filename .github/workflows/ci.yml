name: Aerolith Browser CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js for JavaScript regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute JavaScript regression tests
        run: node --test integrations/playwright-node/index.test.js

      - name: Set up Python for SDK regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Python SDK regression tests
        run: python -m unittest discover -s integrations/playwright-python -p test_sdk.py

      - name: Execute unit test battery
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Compile release binary
        run: cargo build --release --target ${{ matrix.target }}
